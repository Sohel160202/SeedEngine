name: Seed Engine Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux window-system headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xorg-dev xvfb xauth libgl1-mesa-dri

      - name: Configure
        run: cmake -S . -B build -DSEED_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke test Seed window and renderer
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a build/editor/SeedStudio --frames=3
          xvfb-run -a build/runtime/SeedRuntime --frames=3

      - name: Upload Windows Seed binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SeedEngine-Windows
          path: |
            build/editor/Release/SeedStudio.exe
            build/runtime/Release/SeedRuntime.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Unix Seed binaries
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SeedEngine-${{ runner.os }}
          path: |
            build/editor/SeedStudio
            build/runtime/SeedRuntime
          if-no-files-found: error
          retention-days: 14
